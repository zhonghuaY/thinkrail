name: Build macOS Intel DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos-intel-dmg.yml

permissions:
  contents: read

jobs:
  build:
    name: macOS Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-
      - run: bun install --frozen-lockfile
      - name: Build desktop app and DMG
        run: bun run desktop:package:stable
      - name: Smoke packaged desktop app
        run: |
          set -eu
          build_dir=apps/desktop/build/stable-macos-x64
          set -- "$build_dir"/*.app/Contents/MacOS/launcher
          if [ "$#" -ne 1 ] || [ ! -x "$1" ]; then
            echo "::error::expected exactly one packaged launcher"
            find "$build_dir" -maxdepth 4 -type f -print
            exit 1
          fi
          bun run smoke:desktop "$1"
      - name: Collect Intel DMG
        run: |
          set -eu
          build_dir=apps/desktop/build/stable-macos-x64
          set -- "$build_dir"/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one macOS x64 DMG"
            find "$build_dir" -maxdepth 3 -type f -print
            exit 1
          fi
          output=thinkrail-desktop-darwin-x64.dmg
          cp "$1" "$output"
          shasum -a 256 "$output" > "$output.sha256"
      - name: Upload DMG
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: thinkrail-desktop-darwin-x64
          path: |
            thinkrail-desktop-darwin-x64.dmg
            thinkrail-desktop-darwin-x64.dmg.sha256
          if-no-files-found: error
          retention-days: 7
